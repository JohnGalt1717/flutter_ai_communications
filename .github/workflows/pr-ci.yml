name: PR CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dart-tests:
    name: Flutter package tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get (workspace)
        run: flutter pub get

      - name: Dart fix (no remaining suggestions)
        run: |
          set -euo pipefail
          dart fix --dry-run | tee dart-fix-dry-run.log
          if grep -q 'proposed fix' dart-fix-dry-run.log; then
            echo '::error::dart fix has remaining suggestions. Run dart fix --apply.'
            exit 1
          fi

      - name: Dart analyze
        run: dart analyze

      - name: Test flutter_ai_communications
        working-directory: packages/flutter_ai_communications
        run: flutter test

      - name: Test shared
        working-directory: packages/flutter_ai_communications_shared
        run: flutter test

      - name: Test platform_interface
        working-directory: packages/flutter_ai_communications_platform_interface
        run: flutter test

      - name: Test macOS adapter
        working-directory: packages/flutter_ai_communications_macos
        run: flutter test

      - name: Test iOS adapter
        working-directory: packages/flutter_ai_communications_ios
        run: flutter test

      - name: Test Android adapter
        working-directory: packages/flutter_ai_communications_android
        run: flutter test

      - name: Test web adapter
        working-directory: packages/flutter_ai_communications_web
        run: flutter test

      - name: Test Windows adapter
        working-directory: packages/flutter_ai_communications_windows
        run: flutter test

      - name: Test Linux adapter
        working-directory: packages/flutter_ai_communications_linux
        run: flutter test

      - name: Test webrtc Transport plugin
        working-directory: packages/flutter_ai_communications_webrtc
        run: flutter test

  linux-native:
    name: Linux native compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libpulse-dev libpipewire-0.3-dev libspa-0.2-dev \
            libgdk-pixbuf-2.0-dev libx11-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get (workspace)
        run: flutter pub get

      - name: Build Linux example
        working-directory: example
        run: flutter build linux --debug

  ios-route-policy:
    name: iOS route policy (Swift)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift test IosRoutePolicy
        working-directory: packages/flutter_ai_communications_ios/ios/flutter_ai_communications_ios/IosRoutePolicy
        run: swift test
