name: flutter_ai_communications_windows
description: Windows implementation of flutter_ai_communications.
version: 0.0.1
homepage: https://github.com/JohnGalt1717/flutter_ai_communications
repository: https://github.com/JohnGalt1717/flutter_ai_communications

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

resolution: workspace

dependencies:
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  flutter_ai_communications_platform_interface: ^0.0.1
  flutter_ai_communications_shared: ^0.0.1
  logging: ^1.3.0
  win32: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: flutter_ai_communications
    platforms:
      windows:
        pluginClass: FlutterAiCommunicationsWindowsPlugin
        dartPluginClass: FlutterAiCommunicationsWindows
