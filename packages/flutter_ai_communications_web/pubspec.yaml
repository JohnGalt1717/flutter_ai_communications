name: flutter_ai_communications_web
description: Web implementation of flutter_ai_communications.
version: 0.0.1
homepage: https://github.com/JohnGalt1717/flutter_ai_communications
repository: https://github.com/JohnGalt1717/flutter_ai_communications

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_ai_communications_platform_interface: ^0.0.1
  flutter_ai_communications_shared: ^0.0.1
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: flutter_ai_communications
    platforms:
      web:
        pluginClass: FlutterAiCommunicationsWeb
        fileName: flutter_ai_communications_web.dart
